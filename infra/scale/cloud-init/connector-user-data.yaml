#cloud-config
# Connector host provisioning (docs/PLAN.md "Filesystem access from the
# connector": Linux NAS/VM option, using cloudsoda/go-smb2's target — an
# ordinary OS-level CIFS mount, so the connector binary just reads a local
# path and needs no SMB-aware code of its own). Prepares a clean Ubuntu
# Server LTS VM at a firm's site with: the CIFS mount of their file
# share, the connector wired as a systemd service (Restart=always, so it
# starts working the moment the binary is copied into place — see
# infra/scale/README.md, the binary itself isn't fetched by this file),
# and a firewall with NOTHING open but SSH. That last part is the whole
# pitch made concrete: this VM makes zero inbound exceptions beyond your
# own admin access, only outbound HTTPS to the portal + relay.
#
# Three placeholders below MUST be filled in before use — search for
# "REPLACE_ME". Never commit real values into this file; it's checked
# into git as a reusable template, same as infra/proxmox's SSH-key
# placeholder.
#
# Same reasoning as infra/proxmox/cloud-init/user-data.yaml for doing
# package/network work inside runcmd (after an explicit network-ready
# wait), not the top-level packages: shorthand — that shorthand's earlier
# cloud-init stage has no retry logic and a single failed fetch there
# silently aborts everything after it, including the firewall rules.

hostname: REPLACE_ME_HOSTNAME
manage_etc_hosts: true

users:
  - name: opsadmin
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - REPLACE_ME_SSH_PUBLIC_KEY

write_files:
  - path: /etc/apt/apt.conf.d/51-unattended-upgrades-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  # CIFS credentials file, not inline mount options — keeps the password
  # out of `mount`'s argv (visible to any local user via `ps`) and out of
  # /etc/fstab, which is often world-readable. 0600, root-owned.
  - path: /etc/samba/connector-share-credentials
    permissions: "0600"
    owner: root:root
    content: |
      username=REPLACE_ME_SMB_USERNAME
      password=REPLACE_ME_SMB_PASSWORD
      domain=REPLACE_ME_SMB_DOMAIN

  # Started disabled/without the binary present — see infra/scale/README.md
  # "Deploying the connector binary" for the one remaining manual step.
  # Restart=always means the moment the binary is copied to
  # /opt/law-portal-connector/connector, the next restart attempt (at most
  # RestartSec later) succeeds with no further action needed here.
  - path: /etc/systemd/system/law-portal-connector.service
    content: |
      [Unit]
      Description=Law Portal connector
      After=network-online.target
      Wants=network-online.target
      RequiresMountsFor=/srv/connector-docroot

      [Service]
      Type=simple
      User=opsadmin
      ExecStart=/opt/law-portal-connector/connector -portal https://documents.networkzoo.ca -connector-id REPLACE_ME_CONNECTOR_ID -token REPLACE_ME_CONNECTOR_TOKEN -document-root /srv/connector-docroot
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

mounts:
  # uid/gid/file_mode/dir_mode: without these, a CIFS mount is typically
  # root:root 0755 regardless of share ACLs, which the connector (running
  # as opsadmin, see the service unit above) can't write to for the
  # receive_upload job type. 1000 is opsadmin's uid/gid as the first
  # non-root user cloud-init creates. Tune vers= if the file server is old
  # enough to need SMB2 instead of 3.0 (rare on anything patched since ~2018).
  - [ "//REPLACE_ME_FILE_SERVER_HOST/REPLACE_ME_SHARE_NAME", /srv/connector-docroot, cifs,
      "credentials=/etc/samba/connector-share-credentials,uid=1000,gid=1000,file_mode=0664,dir_mode=0775,vers=3.0,_netdev",
      "0", "0" ]

runcmd:
  - |
    for i in $(seq 1 60); do
      getent hosts archive.ubuntu.com >/dev/null 2>&1 && break
      sleep 2
    done

  - apt-get update
  - apt-get upgrade -y
  - apt-get install -y ca-certificates curl ufw fail2ban unattended-upgrades cifs-utils

  - mkdir -p /srv/connector-docroot
  - mkdir -p /opt/law-portal-connector
  - chown opsadmin:opsadmin /opt/law-portal-connector

  # mount -a here (rather than waiting for the mounts: module's own timing)
  # so a mount failure is visible in this boot's cloud-init log immediately.
  - mount -a

  - systemctl daemon-reload
  - systemctl enable --now law-portal-connector

  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - systemctl restart ssh

  # No web/app ports at all — the connector makes only outbound calls, so
  # unlike infra/proxmox's portal VM there is nothing to open beyond SSH.
  # TODO before this reaches anything but a lab network: restrict SSH to
  # your actual admin subnet/VPN range instead of "anywhere".
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw --force enable

  - systemctl enable --now unattended-upgrades
  - systemctl enable --now fail2ban

power_state:
  mode: reboot
  message: "Rebooting after initial provisioning"
  condition: true
