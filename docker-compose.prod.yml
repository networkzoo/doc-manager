services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: law_portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: law_portal
    volumes:
      - portal_pgdata:/var/lib/postgresql/data
    # Bound to localhost only — reachable for migrations run from the VM
    # host (see infra/deploy/README.md), but not from the network. The
    # `portal` service reaches it over the internal compose network below,
    # not through this published port.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://law_portal:${POSTGRES_PASSWORD}@db:5432/law_portal
      AUTH_SECRET: ${AUTH_SECRET}
      # Explicit and deterministic, rather than relying on Auth.js
      # inferring the canonical URL from forwarded headers alone — in
      # practice that inference fell back to http://<HOSTNAME>:<PORT>
      # (literally http://0.0.0.0:3000 — HOSTNAME=0.0.0.0 in
      # apps/portal/Dockerfile is correct and necessary for the server to
      # bind on all interfaces, but the same env var apparently gets
      # reused as a URL-construction fallback somewhere in the stack).
      # Pinning AUTH_URL sidesteps that ambiguity entirely.
      AUTH_URL: https://${PORTAL_DOMAIN}
      # Still worth keeping alongside AUTH_URL — some Auth.js internals
      # still consult this when deciding whether to trust forwarded
      # headers at all, behind any reverse proxy.
      AUTH_TRUST_HOST: "true"
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Deliberately the PUBLIC endpoint (through Caddy), not the internal
      # minio:9000 docker-network address — presigned URLs get handed to
      # the browser and to connectors on other networks entirely, neither
      # of which can resolve the internal hostname.
      RELAY_ENDPOINT: https://${RELAY_DOMAIN}
      RELAY_ACCESS_KEY_ID: ${RELAY_ACCESS_KEY_ID}
      RELAY_SECRET_ACCESS_KEY: ${RELAY_SECRET_ACCESS_KEY}
      RELAY_BUCKET: ${RELAY_BUCKET}
    ports:
      # Direct HTTP access, bypassing Caddy/TLS — kept because it's
      # LAN-only, not internet-exposed (see infra/proxmox/cloud-init's ufw
      # rules). Real sign-in goes through Caddy on 443 below, since OAuth
      # redirect URIs require HTTPS.
      - "3000:3000"
    networks:
      - internal

  caddy:
    build:
      context: ./infra/caddy
    restart: unless-stopped
    depends_on:
      - portal
      - minio
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
      RELAY_DOMAIN: ${RELAY_DOMAIN}
      CLOUDNS_AUTH_ID: ${CLOUDNS_AUTH_ID:-}
      CLOUDNS_SUB_AUTH_ID: ${CLOUDNS_SUB_AUTH_ID:-}
      CLOUDNS_AUTH_PASSWORD: ${CLOUDNS_AUTH_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Cert storage — must persist across restarts, or Caddy re-requests
      # from Let's Encrypt every time and risks hitting rate limits.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # Self-hosted S3-compatible relay store (docs/PLAN.md "Tunnel-free file
  # flow" + Risk R1 — this replaces the originally-planned Wasabi/S3
  # option: zero added cost given existing rack capacity, and it
  # sidesteps Wasabi's minimum-storage-duration billing and egress
  # fair-use terms entirely, which never fit this workload's pattern
  # anyway). Never published directly — only reachable through Caddy,
  # same as `portal`.
  minio:
    # -cpuv1: MinIO's images have required x86-64-v2 CPU features since
    # RELEASE.2023-11-01T01-57-10Z (RHEL9-minimal base) and fail with
    # "Fatal glibc error: CPU does not support x86-64-v2" otherwise — this
    # VM's Proxmox CPU type (kvm64, the conservative live-migration-safe
    # default) doesn't expose them. The -cpuv1 tag is MinIO's own build
    # for exactly this case, cheaper than changing the VM's CPU type
    # (which needs a full power-cycle, not just a reboot).
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z-cpuv1
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  internal:

volumes:
  portal_pgdata:
  caddy_data:
  caddy_config:
  minio_data:
