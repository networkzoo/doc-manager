services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: law_portal
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: law_portal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
